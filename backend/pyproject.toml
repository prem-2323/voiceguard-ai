[project]
name = "voiceguard-backend"
version = "0.1.0"
description = "FastAPI backend for the VoiceGuard AI demonstration"
requires-python = ">=3.12,<3.13"
dependencies = [
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "passlib[bcrypt]>=1.7.4,<2",
    "pydantic-settings>=2.6,<3",
    "python-jose[cryptography]>=3.3,<4",
    "python-multipart>=0.0.18,<1",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.uv]
package = false
